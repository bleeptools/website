# Publishes the site to GitHub Pages on every push to main.
# Only the files the pages need are deployed: specs, copy docs and the
# original source images in assets/ stay in the repo but are not published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels a queued (not running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude '_site/' \
            --exclude 'assets/' \
            --exclude '*.md' \
            ./ _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
